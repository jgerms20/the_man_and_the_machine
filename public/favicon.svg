<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .waveform-left { fill: none; stroke: #D4A574; stroke-width: 1.5; stroke-linecap: round; }
      .waveform-right { fill: none; stroke: #4A9FD4; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" fill="#0A0A0F"/>

  <!-- Left waveform (amber) -->
  <path class="waveform-left" d="M 4 16 Q 6 12 8 16 T 12 16"/>
  <path class="waveform-left" d="M 4 20 Q 6 18 8 20 T 12 20"/>

  <!-- Right waveform (cyan) -->
  <path class="waveform-right" d="M 20 16 Q 22 12 24 16 T 28 16"/>
  <path class="waveform-right" d="M 20 20 Q 22 18 24 20 T 28 20"/>

  <!-- Center overlap accent -->
  <circle cx="16" cy="16" r="2" fill="#D4A574" opacity="0.6"/>
  <circle cx="16" cy="16" r="1.2" fill="#4A9FD4" opacity="0.8"/>
</svg>
